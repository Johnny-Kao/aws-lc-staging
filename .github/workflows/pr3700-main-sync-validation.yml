name: PR3700 Staging Main Sync Validation
on:
  push:
    branches: ['staging/pr3700-main-sync-20261120']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python314-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CPython 3.14
        run: git clone --depth 1 --branch 3.14 https://github.com/python/cpython.git /tmp/cpython-3.14
      - name: Verify AWS-LC 3.14 integration patch applies
        run: |
          sed 's|AWS_LC_INSTALL_PLACEHOLDER|/tmp/aws-lc-install|g' tests/ci/integration/python_patch/3.14/aws-lc-cpython.patch | patch -p1 --dry-run --batch -d /tmp/cpython-3.14
      - name: Verify skip for unsupported TLS 1.3 PSK
        run: |
          grep -F '@unittest.skipIf(IS_AWS_LC, ' tests/ci/integration/python_patch/3.14/aws-lc-cpython.patch
  fork-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang valgrind
      - name: Configure and build
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build --target crypto_test -j 4
      - name: Run fork-generation regression
        run: build/crypto/crypto_test --gtest_filter='ForkDetect.*'
      - name: Run synchronized first-read under Valgrind
        run: valgrind --tool=memcheck --error-exitcode=99 build/crypto/crypto_test --gtest_filter='ForkDetect.SimultaneousFirstReadAfterFork'
